name: voxcita
description: "A private, local-first voice thinking companion with source-linked intelligence."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Persistence
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28

  # File system
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Audio recording
  record: ^5.2.0

  # Permissions
  permission_handler: ^11.4.0

  # Cryptography (SHA-256 hashing for audio integrity)
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  drift_dev: ^2.24.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
